[pytest]
DJANGO_SETTINGS_MODULE = app.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# --no-migrations: conftest.py pins the test database to sqlite, and
# pricing/0003 renames a table and adds a constraint with Postgres-only raw
# SQL, so migrating the sqlite test database fails before any test runs.
# Tables are built from the models instead.
# -p tests_env: sets DJANGO_SECRET_KEY and the sqlite test database in the
# environment before pytest-django configures Django. conftest.py is too
# late for anything settings.py reads at import time.
addopts = -v --tb=short --no-migrations -p tests_env

markers =
    # tests/test_user_materials_migration.py: applies real migrations in a
    # child process, because --no-migrations above makes that impossible in
    # this one. Runs by default — there is no CI that runs pytest, so an
    # opt-in gate here would never be opened. Deselect with -m "not migrations"
    # while iterating; it costs one ~25s subprocess for the whole module.
    migrations: exercises `migrate` for real, in a subprocess.
