version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: itq_forms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itq_forms
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5437:5432"
    volumes:
      - itq_forms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d itq_forms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  itq_forms_postgres_data:
