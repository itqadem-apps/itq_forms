name: Auto Tag, Release, and Build Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_version:
        description: "Manually specify next release version (leave empty for auto)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      latest_tag: ${{ steps.bump_version.outputs.latest_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Fetch All Tags
        run: git fetch --tags --force

      - name: Determine Next Release Version
        id: bump_version
        run: |
          branch_name="${GITHUB_REF#refs/heads/}"
          manual_version="${{ github.event.inputs.release_version }}"

          prefix="v"
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          latest_tag=${latest_tag:-v0.0.0}
          latest_tag_alias="latest"

          if [[ -n "$manual_version" ]]; then
            # Use manually provided version directly
            new_tag="${prefix}${manual_version}"
          else
            # Auto bump
            version=$(echo "$latest_tag" | sed -E "s/^${prefix}//")
            IFS='.' read -r -a parts <<< "$version"
            while true; do
              parts[2]=$((parts[2] + 1))
              new_version="${parts[0]}.${parts[1]}.${parts[2]}"
              new_tag="${prefix}${new_version}"
              if ! git rev-parse "$new_tag" >/dev/null 2>&1; then
                break
              fi
            done
          fi

          echo "new_tag=$new_tag" >> $GITHUB_ENV
          echo "latest_tag=$latest_tag_alias" >> $GITHUB_ENV
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "latest_tag=$latest_tag_alias" >> $GITHUB_OUTPUT

      - name: Create and Push Git Tag
        run: |
          git tag -a ${{ env.new_tag }} ${{ github.sha }} -m "Release ${{ env.new_tag }}"
          git push origin ${{ env.new_tag }}

      - name: Create GitHub Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.new_tag }}
          name: Release ${{ env.new_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-and-push-ghcr:
    needs: tag-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.get_image_name.outputs.IMAGE_NAME }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Image name
        id: get_image_name
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          echo "IMAGE_NAME=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.get_image_name.outputs.IMAGE_NAME }}:${{ needs.tag-and-release.outputs.new_tag }}
            ${{ steps.get_image_name.outputs.IMAGE_NAME }}:${{ needs.tag-and-release.outputs.latest_tag }}

  notify:
    needs: [tag-and-release, build-and-push-ghcr]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord
        env:
          BUILD_RESULT: ${{ needs.build-and-push-ghcr.result }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          NEW_TAG: ${{ needs.tag-and-release.outputs.new_tag }}
          IMAGE_NAME: ${{ needs.build-and-push-ghcr.outputs.image_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ "$BUILD_RESULT" = "success" ]; then
            COLOR=3066993
            TITLE=":white_check_mark: Pipeline Succeeded"
            STATUS="success"
          else
            COLOR=15158332
            TITLE=":x: Pipeline Failed"
            STATUS="failure"
          fi

          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -n 1)
          SHORT_SHA=$(printf '%s' "$COMMIT_SHA" | cut -c1-7)
          IMAGE="${IMAGE_NAME}:${NEW_TAG}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build the JSON with jq so every string is escaped safely —
          # inlining untrusted text (commit messages, branch names) into
          # a bash-quoted JSON body is the footgun that caused this to
          # fail on parentheses in commit messages.
          PAYLOAD=$(jq -n \
            --arg title       "$TITLE" \
            --argjson color   "$COLOR" \
            --arg repo        "$REPOSITORY" \
            --arg status      "$STATUS" \
            --arg branch      "$BRANCH" \
            --arg tag         "$NEW_TAG" \
            --arg actor       "$ACTOR" \
            --arg short_sha   "$SHORT_SHA" \
            --arg commit_url  "$COMMIT_URL" \
            --arg commit_msg  "$COMMIT_MSG" \
            --arg image       "$IMAGE" \
            --arg timestamp   "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                description: ("Build for **" + $repo + "** completed with status: **" + $status + "**"),
                fields: [
                  {name: "Project",        value: "Itqadem",                              inline: true},
                  {name: "Service",        value: "forms",                                inline: true},
                  {name: "Branch",         value: ("`" + $branch + "`"),                  inline: true},
                  {name: "Tag",            value: ("`" + $tag + "`"),                     inline: true},
                  {name: "Triggered by",   value: $actor,                                 inline: true},
                  {name: "Commit",         value: ("[`" + $short_sha + "`](" + $commit_url + ")"), inline: true},
                  {name: "Commit Message", value: $commit_msg,                            inline: false},
                  {name: "Docker Image",   value: ("`" + $image + "`"),                   inline: false}
                ],
                timestamp: $timestamp,
                footer: {text: "GitHub Actions"}
              }]
            }')

          curl -sS -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

      - name: Trigger Tekton Deploy
        run: |
          PAYLOAD='{"repository":"${{ github.repository }}","tag":"${{ needs.tag-and-release.outputs.new_tag }}","branch":"${{ github.ref_name }}","image_name":"${{ needs.build-and-push-ghcr.outputs.image_name }}"}'
          SIGNATURE=$(echo -n "${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.TEKTON_WEBHOOK_SECRET }}" | cut -d' ' -f2)
          curl -X POST https://tekton.fritill.ae \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "${PAYLOAD}"
